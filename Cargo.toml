[workspace]
members = [
    "crates/meshlint-core",
    "crates/meshlint-cli",
    "crates/meshlint-wasm",
]
resolver = "3"

[workspace.package]
edition = "2024"
version = "0.1.0"
license = "MIT"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
